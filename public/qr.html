<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <meta name="description" content="STANY PAIRING - QR Code Pairing">
  
  <meta property="og:title" content="STANY TZ • QR Pairing">
  <meta property="og:description" content="Scan QR code to pair your WhatsApp">
  <meta property="og:image" content="https://raw.githubusercontent.com/Official123-12/STANYFREEBOT-/refs/heads/main/IMG_1377.jpeg">
  
  <title>STANY TZ • QR Pairing</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Copy the entire style from your qr.html */
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="badge">
      <i class="fa-solid fa-qrcode"></i>
      <span>QR PAIRING</span>
    </div>

    <div class="brand">
      <img src="https://raw.githubusercontent.com/Official123-12/STANYFREEBOT-/refs/heads/main/IMG_1377.jpeg" class="logo" onerror="this.style.display='none'">
      <h2 class="title">STANY<span>TZ</span></h2>
      <div class="subtitle">Scan to Connect</div>
    </div>

    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>Link Device</span>
      </div>
      <div class="card-hint">
        Open WhatsApp → Linked Devices → Link a Device
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="status-text">Generating QR Code...</div>
      </div>

      <!-- QR Display -->
      <div id="qrDisplay" class="qr-wrapper" style="display: none;">
        <div class="qr-frame">
          <div class="qr-frame-inner">
            <img id="qrImage" src="" alt="QR Code">
          </div>
        </div>
        <div id="qrStatus" class="status-text">Waiting for scan...</div>

        <div class="steps">
          <div class="step"><div class="step-num">1</div><div class="step-text">Open WhatsApp on your phone</div></div>
          <div class="step"><div class="step-num">2</div><div class="step-text">Go to <strong>Settings</strong> → <strong>Linked Devices</strong></div></div>
          <div class="step"><div class="step-num">3</div><div class="step-text">Tap <strong>Link a Device</strong> and scan this QR</div></div>
        </div>
      </div>

      <!-- Error State -->
      <div id="errorDisplay" class="error-area">
        <div class="error-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <div id="errorMessage" class="error-message">Failed to load QR. Please try again.</div>
        <button id="retryBtn" class="retry-btn"><i class="fa-solid fa-rotate-right"></i> Retry</button>
      </div>
    </div>

    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <script>
    // Security, QR loading, particles
    document.addEventListener('contextmenu', e => e.preventDefault());

    const loading = document.getElementById('loading');
    const qrDisplay = document.getElementById('qrDisplay');
    const errorDisplay = document.getElementById('errorDisplay');
    const qrImage = document.getElementById('qrImage');
    const qrStatus = document.getElementById('qrStatus');
    const errorMessage = document.getElementById('errorMessage');
    const retryBtn = document.getElementById('retryBtn');

    let refreshTimeout;

    async function loadQR() {
      if (refreshTimeout) clearTimeout(refreshTimeout);

      loading.style.display = 'flex';
      qrDisplay.style.display = 'none';
      errorDisplay.style.display = 'none';

      try {
        const response = await fetch('/qr', {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          credentials: 'same-origin'
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const qrData = data.qr || data.qrCode || data.code || data.pairCode;
        if (!qrData) throw new Error('No QR data received');

        if (qrData.startsWith('data:image') || qrData.startsWith('http')) {
          qrImage.src = qrData;
        } else {
          qrImage.src = `data:image/png;base64,${qrData}`;
        }

        await new Promise((resolve, reject) => {
          qrImage.onload = resolve;
          qrImage.onerror = () => reject(new Error('Failed to load image'));
        });

        if (data.message) qrStatus.textContent = data.message;
        else qrStatus.textContent = 'Scan with WhatsApp • Refreshes in 60s';

        loading.style.display = 'none';
        qrDisplay.style.display = 'flex';

        refreshTimeout = setTimeout(() => {
          if (qrDisplay.style.display !== 'none') {
            qrStatus.textContent = 'Refreshing...';
            loadQR();
          }
        }, 60000);

      } catch (err) {
        console.error('QR error:', err);
        errorMessage.textContent = err.message || 'Failed to load QR. Check connection.';
        loading.style.display = 'none';
        errorDisplay.style.display = 'flex';
      }
    }

    retryBtn.addEventListener('click', loadQR);
    loadQR();

    // Particles (same as before)
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    let animFrame;

    function initParticles() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      const count = Math.min(Math.floor(width * height / 15000), 50);
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          size: Math.random() * 2 + 1,
          opacity: Math.random() * 0.3 + 0.1
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 120) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(0, 207, 255, ${0.1 * (1 - dist/120)})`;
            ctx.stroke();
          }
        }
        particles[i].x += particles[i].vx;
        particles[i].y += particles[i].vy;
        if (particles[i].x < 0 || particles[i].x > width) particles[i].vx *= -1;
        if (particles[i].y < 0 || particles[i].y > height) particles[i].vy *= -1;
        ctx.beginPath();
        ctx.arc(particles[i].x, particles[i].y, particles[i].size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(0, 207, 255, ${particles[i].opacity})`;
        ctx.fill();
      }
      animFrame = requestAnimationFrame(drawParticles);
    }

    window.addEventListener('resize', () => {
      clearTimeout(window.resizeTimer);
      window.resizeTimer = setTimeout(() => {
        cancelAnimationFrame(animFrame);
        initParticles();
        drawParticles();
      }, 200);
    });

    initParticles();
    drawParticles();
  </script>
</body>
</html>
