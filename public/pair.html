<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a12">
  <meta name="description" content="INSIDIOUS PAIRING - Get your 8-digit code">
  
  <meta property="og:title" content="INSIDIOUS • Pair Code">
  <meta property="og:description" content="Enter your phone number to get a real WhatsApp pairing code">
  <meta property="og:image" content="https://raw.githubusercontent.com/Official123-12/STANYFREEBOT-/refs/heads/main/IMG_1377.jpeg">
  
  <title>INSIDIOUS • Pair Code</title>

</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="badge">
      <i class="fa-solid fa-key"></i>
      <span>PAIR CODE</span>
    </div>

    <div class="brand">
      <img src="https://raw.githubusercontent.com/Official123-12/STANYFREEBOT-/refs/heads/main/IMG_1377.jpeg" class="logo" onerror="this.style.display='none'">
      <h2 class="title">STANY<span>TZ</span></h2>
      <div class="subtitle">Enter Phone Number</div>
    </div>

    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-phone"></i>
        <span>Get Pair Code</span>
      </div>
      <div class="card-hint">
        Enter your full phone number with country code<br>
        <strong>Example:</strong> 255618123456
      </div>

      <div class="input-row">
        <div class="input-wrapper">
          <input type="tel" id="phoneInput" class="phone-input" placeholder="e.g., 255618123456" inputmode="numeric" maxlength="15">
        </div>
        <button id="submitBtn" class="submit-btn">
          <i class="fa-solid fa-bolt"></i>
          <span>Get</span>
        </button>
      </div>

      <div id="statusArea" class="status-area"></div>
      <div id="codeArea"></div>
    </div>

    <a href="/" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <script>
    // Security, particles, and main logic
    document.addEventListener('contextmenu', e => e.preventDefault());

    const phoneInput = document.getElementById('phoneInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusArea = document.getElementById('statusArea');
    const codeArea = document.getElementById('codeArea');

    function setStatus(message, type = '') {
      if (!message) { statusArea.innerHTML = ''; return; }
      const icons = {
        loading: '<div class="spinner-small"></div>',
        error: '<i class="fa-solid fa-circle-exclamation"></i>',
        success: '<i class="fa-solid fa-circle-check"></i>'
      };
      statusArea.innerHTML = `<div class="status-message ${type}">${icons[type] || ''}<span>${message}</span></div>`;
    }

    function showCode(code) {
      codeArea.innerHTML = `
        <div class="code-box">
          <div class="code-label"><i class="fa-solid fa-key"></i> YOUR PAIR CODE</div>
          <div class="code-value" id="pairCode">${code}</div>
          <button class="copy-btn" id="copyBtn"><i class="fa-regular fa-copy"></i> Copy Code</button>
        </div>
      `;
      document.getElementById('copyBtn').addEventListener('click', async () => {
        const codeEl = document.getElementById('pairCode');
        const code = codeEl.innerText;
        try {
          await navigator.clipboard.writeText(code);
          const btn = document.getElementById('copyBtn');
          btn.classList.add('copied');
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
          setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Code';
          }, 2000);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = code;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          alert('Code copied to clipboard!');
        }
      });
    }

    async function getPairCode() {
      const raw = phoneInput.value.replace(/\D/g, '');
      codeArea.innerHTML = '';
      phoneInput.classList.remove('error');

      if (!raw || raw.length < 7) {
        phoneInput.classList.add('error');
        setStatus('Please enter a valid phone number (7-15 digits)', 'error');
        phoneInput.focus();
        return;
      }

      submitBtn.disabled = true;
      setStatus('Requesting pair code...', 'loading');

      try {
        const response = await fetch(`/code?number=${raw}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        if (!data.success) {
          throw new Error(data.error || 'Pairing failed');
        }

        const pairCode = data.code || data.pairCode;
        if (!pairCode) {
          throw new Error(data.error || data.message || 'No code in response');
        }

        setStatus('Pair code generated successfully!', 'success');
        showCode(pairCode);
      } catch (err) {
        console.error('Pair error:', err);
        setStatus(err.message || 'Failed to get pair code', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener('click', getPairCode);
    phoneInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') getPairCode();
    });
    phoneInput.addEventListener('input', () => {
      phoneInput.classList.remove('error');
      setStatus('');
    });

    // Particles (copy from your pair.html)
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];
    let animFrame;

    function initParticles() { /* ... */ }
    function drawParticles() { /* ... */ }
    window.addEventListener('resize', () => { /* ... */ });
    initParticles();
    drawParticles();
  </script>
</body>
</html>
